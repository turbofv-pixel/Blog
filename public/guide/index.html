    { title: "병목안시민공원", city: "안양", province: "경기", fee: "무료", indoor: ["실외"], blurb: "시원한 인공폭포와 개울, 모래놀이장과 미끄럼틀까지 갖춘 넓은 시민공원이에요.", tags: ["공원", "놀이터"], postUrl: "https://blog.naver.com/bigbigrabbit/223857181347", lat: 37.4192, lng: 126.9297, category: "nature" },
    { title: "안성팜랜드", city: "안성", province: "경기", fee: "유료", indoor: ["실외"], blurb: "조랑말 승마 체험부터 염소·알파카 교감 체험, 놀이기구까지 즐기는 대형 농장 테마파크예요.", tags: ["동물체험", "승마체험"], postUrl: "https://blog.naver.com/bigbigrabbit/223857178972", lat: 37.0631, lng: 127.1547, category: "nature" },
    { title: "뚜쥬르 빵돌가마마을", city: "천안", province: "충남", fee: "무료", feeDetail: "입장·시식빵은 무료, 어린이 베이킹 체험은 별도 유료", indoor: ["실내", "실외"], blurb: "무료 시식빵부터 아이와 함께하는 베이킹 체험, 미끄럼틀까지 즐기는 빵 테마 마을이에요.", tags: ["베이킹체험", "빵마을"], postUrl: "https://blog.naver.com/bigbigrabbit/223849851905", lat: 36.7511, lng: 127.2436, category: "craft" },
    { title: "히어로 플레이파크 일산점", city: "고양", province: "경기", fee: "유료", feeDetail: "기본권 아이 20,000원(주중 3시간/주말 2시간) / 종일권 아이 25,000원, 어른 7,000원", indoor: ["실내"], blurb: "출렁다리·볼풀장부터 정글짐, 오락실까지 갖춘 미국형 키즈카페예요.", tags: ["키즈카페", "실내놀이터"], postUrl: "https://blog.naver.com/bigbigrabbit/223846522583", lat: 37.6797, lng: 126.7783, category: "playground" },
    { title: "벙커키즈", city: "분당", province: "경기", fee: "유료", feeDetail: "아이 10,000원(1시간, 초과 10분당 1,500원) / 어른 4,000원", indoor: ["실내"], blurb: "킥보드·자전거는 물론 경운기까지 탈 수 있는 넓은 트랙이 있는 키즈카페예요.", tags: ["키즈카페", "트랙"], postUrl: "https://blog.naver.com/bigbigrabbit/223767160524", lat: 37.3826, lng: 127.1189, category: "playground" },
    { title: "요미체", city: "안양", province: "경기", fee: "유료", feeDetail: "1회권 또는 회원권 (금액은 매장 문의)", indoor: ["실내"], blurb: "미술·쿠킹 수업을 아이와 함께하는 프리미엄 수업형 키즈카페예요.", tags: ["키즈카페", "미술수업"], postUrl: "https://blog.naver.com/bigbigrabbit/223763405161", lat: 37.3894, lng: 126.9522, category: "craft" },
    { title: "고고다이노 EX 안양과천점", city: "과천", province: "경기", fee: "유료", feeDetail: "공휴일 아이 30,000원(종일권)/25,000원(2시간) · 평일 아이 25,000원(종일권)/20,000원(2시간), 어른 5,000원", indoor: ["실내"], blurb: "공룡 캐릭터 포토타임부터 롤러코스터, 튜브 슬라이드까지 즐기는 공룡 테마 키즈카페예요.", tags: ["키즈카페", "공룡테마"], postUrl: "https://blog.naver.com/bigbigrabbit/223756242873", lat: 37.4256, lng: 126.9908, category: "playground" }
  ];

  // 사진이 없는 카드용 카테고리 일러스트 — 실제 사진처럼 보이지 않게 라인아트로만
  var ICONS = {
    museum: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12L16 5l12 7"/><path d="M6 12v13M11 12v13M16 12v13M21 12v13M26 12v13"/><path d="M3 25h26"/></svg>',
    nature: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="12" r="8"/><path d="M16 20v8M12 28h8"/></svg>',
    playground: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 26L18 8l4 4-14 14z"/><circle cx="24" cy="10" r="3"/></svg>',
    science: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4h6M14 4v8l-7 14a2 2 0 0 0 2 3h14a2 2 0 0 0 2-3l-7-14V4"/><circle cx="14" cy="24" r="1" fill="currentColor" stroke="none"/><circle cx="18" cy="21" r="1" fill="currentColor" stroke="none"/></svg>',
    active: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3" fill="currentColor" stroke="none"/><path d="M12 10l3 6 6 2M15 16l-2 8M15 16l5 4M10 16l-4 3M10 16l3-6"/></svg>',
    craft: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 26c0-6 3-9 6-9s5 2 5 5-3 5-6 5-5-1-5-1z"/><path d="M17 17L26 6l2 2-11 11"/></svg>'
  };

  var state = { q: "", province: "전체", fee: "전체", indoor: "전체", userLoc: null, sortByDistance: false };

  // 근사치 좌표(동/구 단위) 기준 직선거리 — 실제 도로 거리와는 다를 수 있음
  function distanceKm(lat1, lng1, lat2, lng2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLng = (lng2 - lng1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function uniqueSorted(arr) {
    return Array.from(new Set(arr)).sort();
  }

  function buildProvinceFilter() {
    var sel = document.getElementById("province-filter");
    var provinces = ["전체"].concat(uniqueSorted(PLACES.map(function (p) { return p.province; })));
    sel.innerHTML = provinces.map(function (p) { return '<option value="' + p + '">' + (p === "전체" ? "지역 전체" : p) + "</option>"; }).join("");
    sel.addEventListener("change", function () { state.province = sel.value; render(); });
  }

  function buildChips(containerId, values, stateKey, allLabel) {
    var container = document.getElementById(containerId);
    var all = ["전체"].concat(values);
    container.innerHTML = all.map(function (v) {
      var label = v === "전체" ? allLabel : v;
      return '<span class="chip' + (v === "전체" ? " active" : "") + '" data-value="' + v + '">' + label + "</span>";
    }).join("");
    Array.prototype.forEach.call(container.querySelectorAll(".chip"), function (chip) {
      chip.addEventListener("click", function () {
        Array.prototype.forEach.call(container.querySelectorAll(".chip"), function (c) { c.classList.remove("active"); });
        chip.classList.add("active");
        state[stateKey] = chip.getAttribute("data-value");
        render();
      });
    });
  }

  function matches(place) {
    if (state.province !== "전체" && place.province !== state.province) return false;
    if (state.fee !== "전체" && place.fee !== state.fee) return false;
    if (state.indoor !== "전체" && place.indoor.indexOf(state.indoor) === -1) return false;
    if (state.q) {
      var haystack = (place.title + " " + place.city + " " + place.tags.join(" ")).toLowerCase();
      if (haystack.indexOf(state.q.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function cardHtml(place) {
    var feeBadge = place.fee === "무료"
      ? '<span class="badge-sm badge-free">무료</span>'
      : '<span class="badge-sm badge-paid">유료</span>';
    var ticket = place.ticketUrl
      ? '<a class="ticket-btn" href="' + place.ticketUrl + '" target="_blank" rel="noopener">' + place.ticketLabel + "</a>"
      : "";
    var postLink = place.postUrl
      ? '<a class="post-link" href="' + place.postUrl + '" target="_blank" rel="noopener">📝 후기 읽기</a>'
      : "";
    var directionsQuery = encodeURIComponent(place.title + " " + place.city);
    var directionsLink = '<a class="directions-link" href="https://map.kakao.com/link/search/' + directionsQuery + '" target="_blank" rel="noopener">🗺️ 길찾기</a>';
    var media = place.image
      ? '<img src="' + place.image + '" alt="' + place.title + '" loading="lazy" />'
      : '<div class="no-photo">' + (ICONS[place.category] || '<span class="emoji">🐰</span>') + '<span class="caption">사진 준비 중</span></div>';
    var distanceBadge = "";
    if (state.userLoc && place.lat != null) {
      var km = distanceKm(state.userLoc.lat, state.userLoc.lng, place.lat, place.lng);
      var kmText = km < 10 ? km.toFixed(1) : Math.round(km);
      distanceBadge = '<span class="badge-sm distance-badge">약 ' + kmText + "km</span>";
    }
    return (
      '<div class="card">' +
        media +
        '<div class="card-body">' +
          '<div class="badges"><span class="badge-sm badge-region">' + place.province + " · " + place.city + "</span>" + feeBadge + distanceBadge + "</div>" +
          "<h3>" + place.title + "</h3>" +
          '<p class="blurb">' + place.blurb + (place.feeDetail ? " (" + place.feeDetail + ")" : "") + "</p>" +
          '<div class="tags">' + place.tags.map(function (t) { return "<span>#" + t + "</span>"; }).join("") + "</div>" +
          '<div class="card-links">' + postLink + directionsLink + ticket + "</div>" +
        "</div>" +
      "</div>"
    );
  }

  function render() {
    var filtered = PLACES.filter(matches);
    if (state.sortByDistance && state.userLoc) {
      filtered = filtered.slice().sort(function (a, b) {
        return distanceKm(state.userLoc.lat, state.userLoc.lng, a.lat, a.lng) -
          distanceKm(state.userLoc.lat, state.userLoc.lng, b.lat, b.lng);
      });
    }
    document.getElementById("grid").innerHTML = filtered.map(cardHtml).join("");
    document.getElementById("count").textContent = filtered.length + "곳";
    document.getElementById("empty").hidden = filtered.length > 0;
  }

  document.getElementById("search").addEventListener("input", function (e) {
    state.q = e.target.value;
    render();
  });

  var locateBtn = document.getElementById("locate-btn");
  var locateStatus = document.getElementById("locate-status");
  function showLocateStatus(text) {
    locateStatus.textContent = text;
    locateStatus.hidden = !text;
  }
  locateBtn.addEventListener("click", function () {
    if (state.sortByDistance) {
      // 다시 누르면 거리순 정렬 해제 (원래 순서로 복귀)
      state.sortByDistance = false;
      locateBtn.classList.remove("active");
      locateBtn.textContent = "📍 내 위치에서 가까운 순으로 보기";
      showLocateStatus("");
      render();
      return;
    }
    if (!navigator.geolocation) {
      showLocateStatus("이 브라우저에서는 위치 확인을 지원하지 않아요.");
      return;
    }
    locateBtn.disabled = true;
    showLocateStatus("위치 확인 중...");
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        state.userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        state.sortByDistance = true;
        locateBtn.disabled = false;
        locateBtn.classList.add("active");
        locateBtn.textContent = "📍 가까운 순 정렬 중 (누르면 해제)";
        showLocateStatus("직선거리 기준 근사치예요 — 실제 도로 거리와 다를 수 있어요.");
        render();
      },
      function () {
        locateBtn.disabled = false;
        showLocateStatus("위치 접근이 거부됐거나 실패했어요. 브라우저 위치 권한을 확인해주세요.");
      },
      { timeout: 8000 }
    );
  });

  buildProvinceFilter();
  buildChips("fee-chips", uniqueSorted(PLACES.map(function (p) { return p.fee; })), "fee", "무료/유료 전체");
  buildChips("indoor-chips", ["실내", "실외"], "indoor", "실내외 전체");
  render();
</script>
