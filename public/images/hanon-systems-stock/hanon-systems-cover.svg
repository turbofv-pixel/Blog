<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="한온시스템(018880) 주식분석 커버 이미지">
  <defs>
    <style>
      .ff { font-family: 'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="378" rx="18" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="10" rx="5" fill="#2a78d6"/>

  <!-- category pill -->
  <rect x="60" y="42" width="88" height="30" rx="15" fill="#eef4fc"/>
  <text x="104" y="62" class="ff" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">주식분석</text>

  <!-- date pill -->
  <rect x="1032" y="42" width="108" height="30" rx="15" fill="#f3f3f1"/>
  <text x="1086" y="62" class="ff" font-size="13" fill="#898781" text-anchor="middle">2026.08.06 기준</text>

  <!-- title -->
  <text x="58" y="140" class="ff" font-size="42" font-weight="800" fill="#0b0b0b">한온시스템 <tspan fill="#52514e" font-weight="600" font-size="30">(018880)</tspan></text>
  <text x="60" y="180" class="ff" font-size="20" fill="#52514e">열관리 세계 2위, 흔들리는 코스피 속에서 반등을 준비하다</text>

  <!-- stat cards -->
  <g>
    <rect x="60" y="230" width="340" height="112" rx="14" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="84" y="262" class="ff" font-size="14" fill="#898781">현재가 (7월 31일 종가)</text>
    <text x="84" y="300" class="ff" font-size="30" font-weight="800" fill="#0b0b0b">3,305원</text>
    <text x="84" y="324" class="ff" font-size="13" font-weight="700" fill="#d03b3b">▲ 1.22% (전일 대비)</text>
  </g>

  <g>
    <rect x="430" y="230" width="340" height="112" rx="14" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="454" y="262" class="ff" font-size="14" fill="#898781">유상증자 발행가 (2025.12 확정)</text>
    <text x="454" y="300" class="ff" font-size="30" font-weight="800" fill="#0b0b0b">2,830원</text>
    <text x="454" y="324" class="ff" font-size="13" fill="#52514e">최대주주 배정물량 100% 참여</text>
  </g>

  <g>
    <rect x="800" y="230" width="340" height="112" rx="14" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="824" y="262" class="ff" font-size="14" fill="#898781">증권사 목표주가 컨센서스</text>
    <text x="824" y="300" class="ff" font-size="30" font-weight="800" fill="#0ca30c">4,200~4,700원</text>
    <text x="824" y="324" class="ff" font-size="13" font-weight="700" fill="#0ca30c">▲ 현재가 대비 최대 +42%</text>
  </g>

  <text x="1140" y="365" class="ff" font-size="12" fill="#898781" text-anchor="end" font-style="italic">투자 권유 아님 · 정보 제공 목적</text>
</svg>
