<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="한온시스템 주가 흐름과 목표주가 시나리오 차트">
  <defs>
    <style>
      .ff { font-family: 'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="558" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/>

  <!-- Title -->
  <text x="36" y="44" class="ff" font-size="21" font-weight="800" fill="#0b0b0b">한온시스템(018880), 발행가 근처로 되밀린 주가</text>
  <text x="36" y="66" class="ff" font-size="13.5" fill="#52514e">유상증자 발행가·최근 주가 흐름과 증권사 목표주가 밴드 비교</text>

  <!-- forecast shaded zone -->
  <rect x="620" y="90" width="280" height="320" fill="#898781" opacity="0.05"/>

  <!-- target band shaded -->
  <rect x="620" y="208.9" width="280" height="45.7" fill="#0ca30c" opacity="0.10"/>
  <text x="760" y="201" class="ff" font-size="12" fill="#0ca30c" text-anchor="middle" font-weight="700">목표주가 밴드 4,200~4,700원</text>

  <!-- y gridlines -->
  <g class="ff" font-size="12.5" fill="#898781">
    <line x1="70" y1="90" x2="900" y2="90" stroke="#e1e0d9" stroke-width="1"/>
    <text x="60" y="94" text-anchor="end">6,000</text>

    <line x1="70" y1="181.4" x2="900" y2="181.4" stroke="#e1e0d9" stroke-width="1"/>
    <text x="60" y="185.4" text-anchor="end">5,000</text>

    <line x1="70" y1="272.9" x2="900" y2="272.9" stroke="#e1e0d9" stroke-width="1"/>
    <text x="60" y="276.9" text-anchor="end">4,000</text>

    <line x1="70" y1="364.3" x2="900" y2="364.3" stroke="#e1e0d9" stroke-width="1"/>
    <text x="60" y="368.3" text-anchor="end">3,000</text>
  </g>

  <!-- offering price reference line -->
  <line x1="70" y1="379.8" x2="900" y2="379.8" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="76" y="397" class="ff" font-size="12" fill="#eb6834" font-weight="700">유상증자 발행가 2,830원 (참여 최대주주 손익분기 라인)</text>

  <!-- x axis baseline -->
  <line x1="70" y1="410" x2="900" y2="410" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- divider: today -->
  <line x1="620" y1="90" x2="620" y2="410" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- historical solid line -->
  <polyline points="100,379.8 280,119.3 480,340.1 620,336.4"
            fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- forecast branches -->
  <polyline points="620,336.4 880,208.9" fill="none" stroke="#0ca30c" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
  <polyline points="620,336.4 880,379.8" fill="none" stroke="#d03b3b" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>

  <!-- historical markers -->
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="100" cy="379.8" r="6" fill="#2a78d6"/>
    <circle cx="280" cy="119.3" r="6" fill="#2a78d6"/>
    <circle cx="480" cy="340.1" r="6" fill="#2a78d6"/>
    <circle cx="620" cy="336.4" r="7" fill="#0b0b0b"/>
  </g>

  <!-- forecast branch endpoints -->
  <circle cx="880" cy="208.9" r="6" fill="#0ca30c" stroke="#ffffff" stroke-width="2"/>
  <circle cx="880" cy="379.8" r="6" fill="#d03b3b" stroke="#ffffff" stroke-width="2"/>

  <!-- point labels -->
  <g class="ff" font-size="12" fill="#0b0b0b">
    <text x="100" y="365.8" text-anchor="middle" font-weight="700">2,830원</text>
    <text x="100" y="434" text-anchor="middle" fill="#52514e">2025.12 유상증자</text>

    <text x="280" y="99.3" text-anchor="middle" font-weight="700">5,680원(추정)</text>
    <text x="280" y="434" text-anchor="middle" fill="#52514e">2026.6월 중순</text>
    <text x="280" y="450" text-anchor="middle" fill="#52514e">코스피 랠리 동반 급등</text>

    <text x="480" y="326.1" text-anchor="middle" font-weight="700" fill="#d03b3b">3,265원</text>
    <text x="480" y="434" text-anchor="middle" fill="#52514e">7/30 (코스피 폭락 동조)</text>

    <text x="620" y="322.4" text-anchor="middle" font-weight="700" fill="#0b0b0b">3,305원</text>
    <text x="620" y="434" text-anchor="middle" font-weight="800" fill="#0b0b0b">7/31 종가</text>
    <text x="620" y="450" text-anchor="middle" fill="#52514e">(전일比 ▲1.22%)</text>
  </g>

  <g class="ff" font-size="13" font-weight="700">
    <text x="896" y="212.9" fill="#0ca30c">낙관 4,700원</text>
    <text x="896" y="383.8" fill="#d03b3b">비관 2,830원</text>
  </g>

  <!-- legend -->
  <g class="ff" font-size="12.5" fill="#52514e">
    <line x1="70" y1="490" x2="100" y2="490" stroke="#2a78d6" stroke-width="3"/>
    <text x="106" y="494">실제 주가 흐름</text>

    <line x1="240" y1="490" x2="270" y2="490" stroke="#0ca30c" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="276" y="494">낙관 시나리오</text>

    <line x1="400" y1="490" x2="430" y2="490" stroke="#d03b3b" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="436" y="494">비관 시나리오</text>
  </g>

  <text x="964" y="524" class="ff" font-size="11.5" fill="#898781" text-anchor="end">자료: 언론보도·증권사 리포트 종합 · 6월 고점은 추정치</text>
  <text x="36" y="524" class="ff" font-size="11.5" fill="#898781">※ 목표주가는 하나증권 4,700원, 유안타증권 4,200원 기준(2026년 상반기)</text>
</svg>
