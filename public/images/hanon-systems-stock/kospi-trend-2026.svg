<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="2026년 코스피 지수 흐름과 향후 시나리오 차트">
  <defs>
    <style>
      .ff { font-family: 'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="558" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/>

  <!-- Title -->
  <text x="36" y="44" class="ff" font-size="21" font-weight="800" fill="#0b0b0b">코스피, 9,000 고점 찍고 롤러코스터 장세</text>
  <text x="36" y="66" class="ff" font-size="13.5" fill="#52514e">2026년 6월 고점 이후 코스피 지수 흐름과 8월 이후 두 가지 시나리오</text>

  <!-- panic-sell shaded zone -->
  <rect x="100" y="90" width="130" height="320" fill="#d03b3b" opacity="0.06"/>
  <text x="165" y="110" class="ff" font-size="12" fill="#d03b3b" text-anchor="middle" font-weight="700">패닉셀 구간</text>

  <!-- forecast shaded zone -->
  <rect x="620" y="90" width="280" height="320" fill="#898781" opacity="0.06"/>
  <text x="760" y="110" class="ff" font-size="12" fill="#898781" text-anchor="middle" font-weight="700">향후 시나리오(전망)</text>

  <!-- y gridlines -->
  <g class="ff" font-size="12.5" fill="#898781">
    <line x1="70" y1="115.3" x2="900" y2="115.3" stroke="#e1e0d9" stroke-width="1"/>
    <text x="60" y="119.3" text-anchor="end">9,000</text>

    <line x1="70" y1="199.5" x2="900" y2="199.5" stroke="#e1e0d9" stroke-width="1"/>
    <text x="60" y="203.5" text-anchor="end">8,000</text>

    <line x1="70" y1="283.7" x2="900" y2="283.7" stroke="#e1e0d9" stroke-width="1"/>
    <text x="60" y="287.7" text-anchor="end">7,000</text>

    <line x1="70" y1="367.9" x2="900" y2="367.9" stroke="#e1e0d9" stroke-width="1"/>
    <text x="60" y="371.9" text-anchor="end">6,000</text>
  </g>

  <!-- x axis baseline -->
  <line x1="70" y1="410" x2="900" y2="410" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- divider: today -->
  <line x1="620" y1="90" x2="620" y2="410" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- historical solid line -->
  <polyline points="100,105.2 230,376.3 350,317.4 460,346.3 560,317.5 620,317.4"
            fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- forecast branches -->
  <polyline points="620,317.4 880,275.3" fill="none" stroke="#0ca30c" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
  <polyline points="620,317.4 880,384.7" fill="none" stroke="#d03b3b" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>

  <!-- historical markers -->
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="100" cy="105.2" r="6" fill="#2a78d6"/>
    <circle cx="230" cy="376.3" r="6" fill="#2a78d6"/>
    <circle cx="350" cy="317.4" r="6" fill="#2a78d6"/>
    <circle cx="460" cy="346.3" r="6" fill="#2a78d6"/>
    <circle cx="560" cy="317.5" r="6" fill="#2a78d6"/>
    <circle cx="620" cy="317.4" r="7" fill="#0b0b0b"/>
  </g>

  <!-- forecast branch endpoints -->
  <circle cx="880" cy="275.3" r="6" fill="#0ca30c" stroke="#ffffff" stroke-width="2"/>
  <circle cx="880" cy="384.7" r="6" fill="#d03b3b" stroke="#ffffff" stroke-width="2"/>

  <!-- point labels -->
  <g class="ff" font-size="12" fill="#0b0b0b">
    <text x="100" y="91.2" text-anchor="middle" font-weight="700">9,000선↑</text>
    <text x="100" y="434" text-anchor="middle" fill="#52514e">6월 중순 고점</text>

    <text x="230" y="362.3" text-anchor="middle" font-weight="700" fill="#d03b3b">6,000선 붕괴</text>
    <text x="230" y="434" text-anchor="middle" fill="#52514e">7/28~29 (패닉셀)</text>

    <text x="350" y="303.4" text-anchor="middle" font-weight="700" fill="#d03b3b">+17.91%</text>
    <text x="350" y="434" text-anchor="middle" fill="#52514e">7/31 역대급 반등</text>

    <text x="460" y="332.3" text-anchor="middle" font-weight="700">6,257 (-5.12%)</text>
    <text x="460" y="434" text-anchor="middle" fill="#52514e">8/3</text>

    <text x="560" y="303.5" text-anchor="middle" font-weight="700">6,598 (+3.76%)</text>
    <text x="560" y="434" text-anchor="middle" fill="#52514e">8/5</text>

    <text x="620" y="434" text-anchor="middle" font-weight="800" fill="#0b0b0b">오늘(8/6)</text>
    <text x="620" y="450" text-anchor="middle" fill="#52514e">6,600선 공방</text>
  </g>

  <g class="ff" font-size="13" font-weight="700">
    <text x="896" y="279" fill="#0ca30c">낙관 7,000선</text>
    <text x="896" y="388.7" fill="#d03b3b">비관 6,000선</text>
  </g>

  <!-- legend -->
  <g class="ff" font-size="12.5" fill="#52514e">
    <line x1="70" y1="490" x2="100" y2="490" stroke="#2a78d6" stroke-width="3"/>
    <text x="106" y="494">실제 지수 흐름</text>

    <line x1="240" y1="490" x2="270" y2="490" stroke="#0ca30c" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="276" y="494">낙관 시나리오</text>

    <line x1="400" y1="490" x2="430" y2="490" stroke="#d03b3b" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="436" y="494">비관 시나리오</text>
  </g>

  <text x="964" y="524" class="ff" font-size="11.5" fill="#898781" text-anchor="end">자료: 언론보도 종합(2026.08 기준) · 일부 구간은 발표 수치를 바탕으로 재구성한 개념도</text>
  <text x="36" y="524" class="ff" font-size="11.5" fill="#898781">※ 반도체 업종 약세, 외국인·기관 매도, 금리 인상 우려가 복합 작용</text>
</svg>
