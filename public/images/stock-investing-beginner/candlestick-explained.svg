<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="540" rx="24" fill="#0f172a"/>
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">캔들 하나로 보는 시가·종가·고가·저가</text>

  <!-- baseline -->
  <line x1="60" y1="470" x2="840" y2="470" stroke="#334155" stroke-width="2"/>

  <!-- Candle 1: 양봉 (bullish, green) -->
  <g>
    <line x1="270" y1="130" x2="270" y2="420" stroke="#34d399" stroke-width="3"/>
    <rect x="235" y="190" width="70" height="150" rx="4" fill="#03C75A" stroke="#34d399" stroke-width="2"/>
    <text x="270" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#34d399">양봉 (상승 마감)</text>

    <!-- callouts -->
    <line x1="270" y1="130" x2="150" y2="130" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="145" y="135" text-anchor="end" font-size="16" fill="#e2e8f0">고가</text>

    <line x1="305" y1="190" x2="400" y2="190" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="405" y="195" font-size="16" fill="#e2e8f0">종가 (마감가)</text>

    <line x1="235" y1="340" x2="130" y2="340" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="125" y="345" text-anchor="end" font-size="16" fill="#e2e8f0">시가 (시작가)</text>

    <line x1="270" y1="420" x2="150" y2="420" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="145" y="425" text-anchor="end" font-size="16" fill="#e2e8f0">저가</text>
  </g>

  <!-- Candle 2: 음봉 (bearish, red) -->
  <g>
    <line x1="620" y1="130" x2="620" y2="420" stroke="#f87171" stroke-width="3"/>
    <rect x="585" y="190" width="70" height="150" rx="4" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
    <text x="620" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#f87171">음봉 (하락 마감)</text>

    <line x1="655" y1="190" x2="770" y2="190" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="775" y="195" font-size="16" fill="#e2e8f0">시가 (시작가)</text>

    <line x1="655" y1="340" x2="770" y2="340" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="775" y="345" font-size="16" fill="#e2e8f0">종가 (마감가)</text>

    <line x1="620" y1="130" x2="770" y2="105" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="775" y="110" font-size="16" fill="#e2e8f0">고가</text>

    <line x1="620" y1="420" x2="770" y2="445" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="775" y="450" font-size="16" fill="#e2e8f0">저가</text>
  </g>

  <text x="450" y="505" text-anchor="middle" font-size="15" fill="#94a3b8">몸통이 초록색이면 종가가 시가보다 높고(상승), 빨간색이면 종가가 시가보다 낮아요(하락)</text>
</svg>
