<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#151f38"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" rx="24" fill="url(#bg2)"/>

  <text x="500" y="60" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">주식 시작 전 준비물 3단계</text>

  <!-- connecting dashed line -->
  <line x1="185" y1="220" x2="815" y2="220" stroke="#334155" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- Step 1: phone/app -->
  <g>
    <circle cx="185" cy="220" r="80" fill="rgba(3,199,90,0.12)" stroke="#03C75A" stroke-width="2"/>
    <rect x="155" y="175" width="60" height="95" rx="10" fill="#0b1220" stroke="#34d399" stroke-width="3"/>
    <rect x="165" y="188" width="40" height="60" rx="3" fill="#03C75A" opacity="0.35"/>
    <circle cx="185" cy="258" r="5" fill="#34d399"/>
    <text x="185" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#34d399">① 증권계좌 개설</text>
    <text x="185" y="356" text-anchor="middle" font-size="14" fill="#94a3b8">증권사 앱 비대면 개설</text>
  </g>

  <!-- Step 2: ID / money -->
  <g>
    <circle cx="500" cy="220" r="80" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="2"/>
    <rect x="460" y="195" width="80" height="52" rx="8" fill="#0b1220" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="480" cy="221" r="10" fill="#60a5fa" opacity="0.5"/>
    <line x1="498" y1="212" x2="524" y2="212" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <line x1="498" y1="224" x2="524" y2="224" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="498" y1="236" x2="516" y2="236" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <text x="500" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#60a5fa">② 여유자금 준비</text>
    <text x="500" y="356" text-anchor="middle" font-size="14" fill="#94a3b8">없어도 되는 돈으로 소액 시작</text>
  </g>

  <!-- Step 3: checkmark / ready -->
  <g>
    <circle cx="815" cy="220" r="80" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="815" cy="220" r="34" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <path d="M798,220 L811,234 L835,203" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="815" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#fbbf24">③ HTS/MTS 익히기</text>
    <text x="815" y="356" text-anchor="middle" font-size="14" fill="#94a3b8">주문·잔고 화면 미리 연습</text>
  </g>
</svg>
