<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Nanum Gothic','Malgun Gothic',sans-serif">
  <title>Zone CP / Global CP 멀티존 구조</title>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#03C75A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <!-- Global CP -->
  <rect x="350" y="20" width="200" height="60" rx="10" fill="#03C75A" opacity="0.1" stroke="#03C75A" stroke-width="2.5"/>
  <text x="450" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">Global CP</text>
  <text x="450" y="68" text-anchor="middle" font-size="11" fill="#333333">정책은 여기서만 선언</text>

  <!-- connecting lines -->
  <line x1="450" y1="80" x2="160" y2="150" stroke="#03C75A" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="450" y1="80" x2="450" y2="150" stroke="#03C75A" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="450" y1="80" x2="740" y2="150" stroke="#03C75A" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Zone CPs -->
  <g>
    <rect x="70" y="150" width="180" height="56" rx="10" fill="#eaf7ef" stroke="#03C75A" stroke-width="2"/>
    <text x="160" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#0a7a3c">Zone CP (AZ-A)</text>
  </g>
  <g>
    <rect x="360" y="150" width="180" height="56" rx="10" fill="#eaf7ef" stroke="#03C75A" stroke-width="2"/>
    <text x="450" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#0a7a3c">Zone CP (AZ-B)</text>
  </g>
  <g>
    <rect x="650" y="150" width="180" height="56" rx="10" fill="#eaf7ef" stroke="#03C75A" stroke-width="2"/>
    <text x="740" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#0a7a3c">Zone CP (AZ-C)</text>
  </g>

  <!-- dataplane clusters -->
  <g>
    <line x1="160" y1="206" x2="160" y2="240" stroke="#94a3b8" stroke-width="2"/>
    <rect x="90" y="240" width="60" height="40" rx="6" fill="#f5f7fa" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="160" y="240" width="60" height="40" rx="6" fill="#f5f7fa" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="160" y="300" text-anchor="middle" font-size="11" fill="#666666">Dataplanes</text>
  </g>
  <g>
    <line x1="450" y1="206" x2="450" y2="240" stroke="#94a3b8" stroke-width="2"/>
    <rect x="380" y="240" width="60" height="40" rx="6" fill="#f5f7fa" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="450" y="240" width="60" height="40" rx="6" fill="#f5f7fa" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="450" y="300" text-anchor="middle" font-size="11" fill="#666666">Dataplanes</text>
  </g>
  <g>
    <line x1="740" y1="206" x2="740" y2="240" stroke="#94a3b8" stroke-width="2"/>
    <rect x="670" y="240" width="60" height="40" rx="6" fill="#f5f7fa" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="740" y="240" width="60" height="40" rx="6" fill="#f5f7fa" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="740" y="300" text-anchor="middle" font-size="11" fill="#666666">Dataplanes</text>
  </g>

  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#777777">정책은 Global CP에서 중앙 관리하고, 트래픽 처리는 각 Zone 안에서 로컬로 이뤄진다</text>
</svg>
