<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="'Nanum Gothic','Malgun Gothic',sans-serif">
  <title>사이드카 프록시 패턴</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#03C75A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <!-- Control Plane -->
  <rect x="330" y="24" width="240" height="56" rx="10" fill="#03C75A" opacity="0.08" stroke="#03C75A" stroke-width="2"/>
  <text x="450" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">컨트롤 플레인</text>

  <!-- dashed policy arrows -->
  <path d="M400,80 C340,140 300,150 270,190" fill="none" stroke="#03C75A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGreen)"/>
  <path d="M500,80 C560,140 600,150 630,190" fill="none" stroke="#03C75A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGreen)"/>
  <text x="300" y="130" text-anchor="middle" font-size="13" fill="#03C75A">정책 배포</text>
  <text x="600" y="130" text-anchor="middle" font-size="13" fill="#03C75A">정책 배포</text>

  <!-- Service A -->
  <rect x="30" y="220" width="150" height="70" rx="10" fill="#f5f7fa" stroke="#94a3b8" stroke-width="2"/>
  <text x="105" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#222222">서비스 A</text>

  <!-- Sidecar A -->
  <rect x="230" y="205" width="170" height="100" rx="10" fill="#eaf7ef" stroke="#03C75A" stroke-width="2"/>
  <text x="315" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#0a7a3c">사이드카</text>
  <text x="315" y="270" text-anchor="middle" font-size="13" fill="#0a7a3c">(Envoy)</text>

  <!-- Sidecar B -->
  <rect x="500" y="205" width="170" height="100" rx="10" fill="#eaf7ef" stroke="#03C75A" stroke-width="2"/>
  <text x="585" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#0a7a3c">사이드카</text>
  <text x="585" y="270" text-anchor="middle" font-size="13" fill="#0a7a3c">(Envoy)</text>

  <!-- Service B -->
  <rect x="720" y="220" width="150" height="70" rx="10" fill="#f5f7fa" stroke="#94a3b8" stroke-width="2"/>
  <text x="795" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#222222">서비스 B</text>

  <!-- arrows between boxes -->
  <line x1="180" y1="255" x2="228" y2="255" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="204" y="242" text-anchor="middle" font-size="11" fill="#555555">localhost</text>

  <line x1="400" y1="255" x2="498" y2="255" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#111111">HTTP</text>

  <line x1="670" y1="255" x2="718" y2="255" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="694" y="242" text-anchor="middle" font-size="11" fill="#555555">localhost</text>

  <!-- caption -->
  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#777777">서비스는 localhost로만 통신하고, 트래픽 제어·정책 적용은 옆의 사이드카가 전담한다</text>
</svg>
